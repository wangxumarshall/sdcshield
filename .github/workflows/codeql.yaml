name: CodeQL

# C/C++ 静态分析,排除 third-party/ vendored 代码去噪。
# meson 项目 autobuild 不可靠,显式 meson 构建供注入(eigen5 为 in-repo
# vendored,无需 submodule)。
# 跑 x86 机群:托管 ubuntu-24.04-arm 裸 VM 曾被平台侧随机关机(2026-09-25
# 当天 16/19 个 run 构建中途收 SIGTERM);aarch64 专属测试(SVE 等)在 x86
# 被 meson 守卫排除,其编译覆盖由 multi-os-verify 每日 ARM 构建承担。

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '37 2 * * 1'   # 每周一 UTC 02:37 = 北京 10:37

# 合并批次曾 3 分钟连发 7 个 run;同 ref 只留最新,PR 推新时取消旧 run 省配额
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (cpp)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write    # 上传 SARIF 到 Security and quality 页
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: cpp
          config: |
            paths-ignore:
              - third-party
              - bats
              - scripts
      - name: Install build deps
        run: |
          sudo apt-get -y update -qq
          sudo apt-get -y install -qq meson ninja-build libboost-dev libeigen3-dev \
            libgtest-dev libhwloc-dev libssl-dev libzstd-dev zlib1g-dev
      - name: Build (meson, for CodeQL injection)
        run: |
          # arm64 用 vendored eigen5(CLAUDE.md:系统 3.3.x 在 GCC12+ 断);
          # 其余 vendored 依赖缺席时 meson 优雅降级,足够静态分析覆盖面。
          PKG_CONFIG_PATH=./third-party/eigen5 meson setup builddir --buildtype=release
          ninja -C builddir
      - uses: github/codeql-action/analyze@v3

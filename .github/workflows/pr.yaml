name: Pull Request

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# 推新 commit 取消同 PR 旧 run(本 workflow 仅 pull_request 触发,synchronize 必为新 push)
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout target branch (${{ github.base_ref }})
      uses: actions/checkout@v7
      with:
        ref: ${{ github.base_ref }}
        persist-credentials: false
    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check if the PR adds tabs in source files
      run: .github/scripts/check-no-tabs.sh origin/${{ github.base_ref }} HEAD
    - name: Run codespell
      run: |
        pipx install codespell
        codespell
    - name: Install actionlint
      run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bpf)
    - name: Run actionlint
      run: actionlint -shellcheck= -pyflakes= .github/workflows .github/actions

  git-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout the PR merge point
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Run the git checks
      run: .github/scripts/check-git-history.sh ${{ github.base_ref }} ${GITHUB_SHA}

  build-cpu:
    name: Build binary for CPU (Linux)
    needs: [ lint, git-sanity ]
    runs-on: ubuntu-24.04${{ matrix.archsuffix }}
    timeout-minutes: 45          # 实测 ~4min(arm64 4 核,apt+构建+unittests+selftests+quick),宽放
    container: debian:sid
    strategy:
      matrix:
        include:
        # arm64-only 项目:x86/Windows/GPU/IDXD 目标构建已移除(2026-09-25 决定),
        # unittests 覆盖随 x86 项删除移到本项。
        - { name: GCC-arm64, archsuffix: "-arm", unittests: "unittests", selftests: "selftests" }
    steps:
      - name: Checkout the PR merge point
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build for CPU (Linux)
        uses: ./.github/actions/build-cpu
        with:
            name: ${{ matrix.name }}
            env: ${{ matrix.env }}
            meson_args: ${{ matrix.meson_args }}
            unittests: ${{ matrix.unittests }}
      - name: run unittests
        if: ${{ matrix.unittests }}
        shell: bash
        run: |
          ./builddir/unittests \
            --gtest_filter=-LinuxThermalFixture.CurrentMachine_TestUsingSingletomTemperaturesOnCurrentMachine # this test doesn't execute properly in a github runner
      - name: verify selftests
        shell: bash
        run: |
          set -x
          set selftest_skip \
              $(builddir/sdcshield --selftests --list-tests | grep selftest_log_skip) \
              '@positive'
          for t; do
            builddir/sdcshield --quick --selftests -e "$t" -o -
          done
          set selftest_failinit selftest_logerror
          for t; do
            if builddir/sdcshield --quick --retest-on-failure=0 --selftests -e "$t" -o -; then
              exit 1
            else
              [[ $? = 1 ]]
            fi
          done
      - name: run selftests
        if: ${{ matrix.selftests }}
        shell: bash
        run: |
          ulimit -St 120
          SANDSTONE_BIN=builddir/sdcshield bats -t bats/sanity-check
      - name: run tests quickly
        shell: bash
        run: |
          ulimit -St 120
          nproc=`nproc`
          nproc=$((nproc > 4 ? 4 : nproc))
          builddir/sdcshield --quick -n$nproc --retest-on-failure=0 -o -
      - name: upload test run logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-linux-${{ matrix.name }}-logs
          if-no-files-found: ignore
          path: |
            *.yaml
          retention-days: 3

  # multi-version:在 openEuler 多版本容器里构建+纯净验证,作 polyfill/sed 适配层的
  # 回归哨兵。PR 跑"角落三"(最老 toolchain + 基准),覆盖适配层被源码改动带歪的情况。
  # 全 15 SP 的 full 验证留给 nightly/release(另 workflow)。
  multi-version:
    name: Multi-version (${{ matrix.series }}-${{ matrix.sp }})
    needs: [ lint, git-sanity ]
    runs-on: ubuntu-24.04-arm   # GitHub hosted arm64;换 self-hosted 见注释
    timeout-minutes: 90         # 实测 ~7-8min(镜像烘焙+构建+smoke),宽放
    strategy:
      fail-fast: false
      matrix:
        include:
        - { series: "20.03", sp: "LTS" }   # 最老 toolchain(gcc-7+toolset-10),适配层哨兵
        - { series: "22.03", sp: "SP3" }
        - { series: "24.03", sp: "SP3" }   # 基准版本
    steps:
      - name: Checkout PR + submodules(RPM 树)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman skopeo
      - name: Build image + source + smoke-verify (corner three)
        run: |
          # build-all.sh:镜像就绪(幂等)→ 源码构建(杠杆1)→ 打包 → verify-pristine smoke
          # 在 hosted runner 上首次会从 quay 拉 base + 烘焙 deps(~数分钟)。
          # 换 self-hosted runner + ghcr.io 预构建镜像可跳过烘焙,详见 docs/multi-version-build-deploy.md §6。
          ./scripts/offline-build/build-all.sh ${{ matrix.series }} ${{ matrix.sp }} --smoke
      - name: Show result
        if: ${{ always() }}
        run: |
          cat "third-party/rpms/openEuler-${{ matrix.series }}/openEuler-${{ matrix.series }}$(case ${{ matrix.sp }} in LTS) echo LTS;; SP*) echo LTS_${{ matrix.sp }};; esac)/built/VERSION" 2>/dev/null || true

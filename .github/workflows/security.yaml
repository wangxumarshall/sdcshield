name: Security

# CI 流水线自身与依赖面的安全扫描(zizmor / gitleaks / osv-scanner)。
# PR 即时反馈 + 每周一全量(cron 避整点错峰)。

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '23 3 * * 1'   # 每周一 UTC 03:23 = 北京 11:23

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor (workflow security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gitleaks:
    name: gitleaks (credential leaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # 全历史:本仓 fork 自 OpenDCDiag,历史长
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  osv:
    name: osv-scanner (vendored CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            -r
            --skip-git
            ./


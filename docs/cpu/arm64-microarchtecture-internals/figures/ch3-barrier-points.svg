<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" width="1440" height="760" font-family="-apple-system,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
    <marker id="arwR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
  </defs>

  <rect x="0" y="0" width="1440" height="760" fill="#ffffff"/>

  <text x="30" y="32" font-size="20" font-weight="700" fill="#111827">ARM64 屏障生效点地图：一条指令卡在流水线哪一级</text>
  <text x="30" y="53" font-size="12" fill="#6b7280">语义生效点地图（非延迟排名）· DSB 等待时长由 store buffer 深度与读写完成时间决定（N1 SB 深度 TRM 未披露，不引数字）· 数据出处：armv8-isa 文档集 + N1 TRM（0x7C–0x7E 计数 ISB/DSB/DMB）+ 本书整理</text>

  <!-- ============ pipeline spine ============ -->
  <g>
    <!-- 8 stages -->
    <g font-size="12.5" font-weight="700">
      <rect x="60"  y="120" width="150" height="46" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/><text x="135" y="148" text-anchor="middle" fill="#047857">取指 Fetch</text>
      <rect x="232" y="120" width="150" height="46" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/><text x="307" y="148" text-anchor="middle" fill="#047857">译码 Decode</text>
      <rect x="404" y="120" width="150" height="46" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/><text x="479" y="148" text-anchor="middle" fill="#047857">重命名/派遣</text>
      <rect x="576" y="120" width="150" height="46" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/><text x="651" y="148" text-anchor="middle" fill="#047857">发射 Issue</text>
      <rect x="748" y="120" width="150" height="46" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/><text x="823" y="148" text-anchor="middle" fill="#047857">执行 Execute</text>
      <rect x="920" y="120" width="150" height="46" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/><text x="995" y="148" text-anchor="middle" fill="#047857">访存 Memory</text>
      <rect x="1092" y="120" width="150" height="46" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/><text x="1167" y="148" text-anchor="middle" fill="#047857">写回 WB</text>
      <rect x="1264" y="120" width="150" height="46" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2.2"/><text x="1339" y="148" text-anchor="middle" fill="#065f46">提交 Commit</text>
    </g>
    <!-- flow arrows -->
    <g stroke="#374151" stroke-width="2.5">
      <line x1="210" y1="143" x2="228" y2="143" marker-end="url(#arw)"/>
      <line x1="382" y1="143" x2="400" y2="143" marker-end="url(#arw)"/>
      <line x1="554" y1="143" x2="572" y2="143" marker-end="url(#arw)"/>
      <line x1="726" y1="143" x2="744" y2="143" marker-end="url(#arw)"/>
      <line x1="898" y1="143" x2="916" y2="143" marker-end="url(#arw)"/>
      <line x1="1070" y1="143" x2="1088" y2="143" marker-end="url(#arw)"/>
      <line x1="1242" y1="143" x2="1260" y2="143" marker-end="url(#arw)"/>
    </g>
    <text x="135" y="180" font-size="9.5" fill="#6b7280" text-anchor="middle">分支在此重定向</text>
    <text x="1339" y="180" font-size="9.5" fill="#6b7280" text-anchor="middle">架构态唯一写入</text>
  </g>

  <!-- ============ barrier callouts (downward) ============ -->
  <!-- ISB @ fetch -->
  <g>
    <path d="M 135 166 L 135 216" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arwR)"/>
    <rect x="60" y="220" width="240" height="96" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="180" y="242" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">ISB（v8.0）</text>
    <text x="180" y="260" text-anchor="middle" font-size="10" fill="#334155">冲刷流水线 / context synchronization</text>
    <text x="180" y="276" text-anchor="middle" font-size="10" fill="#334155">MSR SCTLR/TTBR 后必须</text>
    <text x="180" y="294" text-anchor="middle" font-size="9.5" fill="#6b7280">仅 SY 合法 · 序列 TLBI→DSB→ISB 的终点</text>
    <text x="180" y="310" text-anchor="middle" font-size="9.5" fill="#b45309">成本中心：全系统均摊（维护操作三连）</text>
  </g>

  <!-- CFP @ decode -->
  <g>
    <path d="M 307 166 L 307 216" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arwC)"/>
    <rect x="312" y="220" width="230" height="96" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 3"/>
    <text x="427" y="242" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">CFP（v8.5 SPECRES）</text>
    <text x="427" y="260" text-anchor="middle" font-size="10" fill="#334155">按上下文失效控制流预测器</text>
    <text x="427" y="276" text-anchor="middle" font-size="10" fill="#334155">Spectre v2 缓解栈的硬件契约</text>
    <text x="427" y="294" text-anchor="middle" font-size="9.5" fill="#6b7280">同族：CPP（预取）/DVP（值预测）</text>
    <text x="427" y="310" text-anchor="middle" font-size="9.5" fill="#b45309">成本：仅显式缓解代码（内核补丁）</text>
  </g>

  <!-- CSDB + SB @ rename/issue -->
  <g>
    <path d="M 479 166 L 479 216" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arwC)"/>
    <path d="M 651 166 L 651 216" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arwC)"/>
    <rect x="554" y="220" width="240" height="96" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 3"/>
    <text x="674" y="242" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">CSDB（v8.5）/ SB（v8.5）</text>
    <text x="674" y="260" text-anchor="middle" font-size="10" fill="#334155">CSDB：操作数消费检查（禁消费推测数据）</text>
    <text x="674" y="276" text-anchor="middle" font-size="10" fill="#334155">SB：推测引擎阻断（禁值预测喂 SB 后指令）</text>
    <text x="674" y="294" text-anchor="middle" font-size="9.5" fill="#6b7280">NZCV/SVE 谓词预测也在 CSDB 管辖内</text>
    <text x="674" y="310" text-anchor="middle" font-size="9.5" fill="#b45309">成本：仅 Spectre 缓解部署的代码路径</text>
  </g>

  <!-- ESB @ writeback -->
  <g>
    <path d="M 1167 166 L 1167 216" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arw)"/>
    <rect x="804" y="220" width="230" height="96" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.6"/>
    <text x="919" y="242" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">ESB（RAS 扩展）</text>
    <text x="919" y="260" text-anchor="middle" font-size="10" fill="#334155">SError → DISR_EL1/VDISR_EL2 同步</text>
    <text x="919" y="276" text-anchor="middle" font-size="10" fill="#334155">不排序、不冲刷（同步语义）</text>
    <text x="919" y="294" text-anchor="middle" font-size="9.5" fill="#6b7280">V110 PFR0.RAS=0（无 v8.2 RAS）；N1 有</text>
    <text x="919" y="310" text-anchor="middle" font-size="9.5" fill="#b45309">第 9 章 RAS 观测链的锚点指令</text>
  </g>

  <!-- DMB/DSB @ memory -->
  <g>
    <path d="M 995 166 L 995 216" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arwR)"/>
    <rect x="1044" y="220" width="370" height="96" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2"/>
    <text x="1229" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">DMB / DSB（v8.0，本图核心）</text>
    <text x="1229" y="260" text-anchor="middle" font-size="10" fill="#334155">DMB：LSU 排序过滤器（观察顺序，不保证完成）</text>
    <text x="1229" y="276" text-anchor="middle" font-size="10" fill="#334155">DSB：停 issue 至 store buffer 空/读完成（nXS 变体 v8.6）</text>
    <text x="1229" y="294" text-anchor="middle" font-size="9.5" fill="#6b7280">domain：OSH/NSH/ISH/SY × types LD/ST/All</text>
    <text x="1229" y="310" text-anchor="middle" font-size="9.5" fill="#b45309">ISH 便宜：只到 cluster 一致点——"同 cluster 数据"折扣价</text>
  </g>

  <!-- ============ domain cost band ============ -->
  <g>
    <rect x="60" y="352" width="660" height="64" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="76" y="374" font-size="11.5" font-weight="700" fill="#111827">DMB 域的折扣阶梯（谁付钱）：</text>
    <text x="76" y="392" font-size="10.5" fill="#334155">ISH（cluster 内一致点，便宜）&lt; OSH/NSH（外设域）&lt; SY（全系统）——同一指令不同域是不同成本中心</text>
    <text x="76" y="408" font-size="10.5" fill="#334155">每次 TLBI/IC 维护的 DSB/ISB 三连由全系统均摊（§3.6.2 DVM issuing 账单：N1 L2 17/23/29 项 snoop acceptance）</text>
  </g>

  <!-- ============ PMU observability ============ -->
  <g>
    <rect x="754" y="352" width="660" height="64" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
    <text x="770" y="374" font-size="11.5" font-weight="700" fill="#6d28d9">屏障成本的 PMU 观测（屏障从此可进性能模型）：</text>
    <text x="770" y="392" font-size="10.5" fill="#334155">N1：0x7C ISB / 0x7D DSB / 0x7E DMB（speculative 口径执行计数）</text>
    <text x="770" y="408" font-size="10.5" fill="#334155">V110 近似：stall_frontend/backend + imp-def exe_stall_cycle 0x7001（发射&lt;4 周期分解，第 8 章）</text>
  </g>

  <!-- ============ four cost centers summary ============ -->
  <g>
    <rect x="60" y="444" width="1354" height="180" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
    <text x="80" y="472" font-size="13.5" font-weight="700" fill="#c2410c">四种"屏障"语境 = 四种成本中心（性能分析先问：这条屏障在地图哪里、谁付账）</text>
    <g font-size="11">
      <rect x="84" y="488" width="310" height="118" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
      <text x="100" y="510" font-weight="700" fill="#9a3412">① 排序折扣（DMB-ISH）</text>
      <text x="100" y="530" fill="#334155">同 cluster 数据场景的折扣价</text>
      <text x="100" y="548" fill="#334155">锁/引用计数 hot path 的常规开销</text>
      <text x="100" y="570" fill="#6b7280">观测：DMB 计数 × 等待周期</text>
      <text x="100" y="590" fill="#6b7280">优化：改 RCsc/RCpc 编码</text>

      <rect x="410" y="488" width="310" height="118" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
      <text x="426" y="510" font-weight="700" fill="#9a3412">② 完成等待（DSB/ISB 三连）</text>
      <text x="426" y="530" fill="#334155">TLBI/IC 维护操作逐次触发</text>
      <text x="426" y="548" fill="#334155">内核页表管理/代码修改均摊</text>
      <text x="426" y="570" fill="#6b7280">观测：DSB 计数 × SB 排空时间</text>
      <text x="426" y="590" fill="#6b7280">优化：批量 TLBI（range 指令）</text>

      <rect x="736" y="488" width="310" height="118" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
      <text x="752" y="510" font-weight="700" fill="#9a3412">③ 推测阻断（SB/CSDB/CFP）</text>
      <text x="752" y="530" fill="#334155">Spectre 缓解补丁显式部署</text>
      <text x="752" y="548" fill="#334155">仅出现在受保护代码路径</text>
      <text x="752" y="570" fill="#6b7280">观测：无专用 PMU（指令计数代理）</text>
      <text x="752" y="590" fill="#6b7280">优化：逐点审计去除不必要的屏障</text>

      <rect x="1062" y="488" width="330" height="118" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
      <text x="1078" y="510" font-weight="700" fill="#9a3412">④ 错误同步（ESB）</text>
      <text x="1078" y="530" fill="#334155">RAS 观测链锚点（不排序不冲刷）</text>
      <text x="1078" y="548" fill="#334155">SError 精确化到指令边界</text>
      <text x="1078" y="570" fill="#6b7280">观测：DISR_EL1.A 读取</text>
      <text x="1078" y="590" fill="#6b7280">边界：V110 无 v8.2 RAS（PFR0=0）</text>
    </g>
  </g>

  <!-- footer -->
  <text x="30" y="672" font-size="10.5" fill="#9ca3af">图 3-2：屏障生效点地图 · 红色 = 停顿/冲刷类（ISB/DMB/DSB），紫色虚线 = 推测控制类（CFP/CSDB/SB），绿色 = 同步类（ESB）· 与正文 §3.5.4 ASCII 图及 §3.6 系统指令章对应 · V2 世代加入 PBHA/BTI 与 MRS 上的 DIT，两台研究机均不含</text>
</svg>

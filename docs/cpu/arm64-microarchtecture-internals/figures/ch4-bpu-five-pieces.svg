<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="-apple-system,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker>
    <marker id="arwR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>

  <text x="30" y="32" font-size="20" font-weight="700" fill="#111827">分支预测五件套：按分支类型分工的预测流水与 V110/N1 参数对比</text>
  <text x="30" y="53" font-size="12" fill="#6b7280">预测在取指之前——BPU 用当前 PC 查询，命中则下周期从预测目标取指 · 查询单位 = 取指块 · N1 几何全部"由 RAMINDEX 编码推断"（TRM 正文未明文）· 数据出处：kunpeng920_microarchitecture.md / N1 TRM RAMINDEX / gem5 V2 配置</text>

  <!-- ============ top: prediction pipeline (query before fetch) ============ -->
  <g>
    <text x="60" y="96" font-size="13.5" font-weight="700" fill="#0e7490">预测流水：预测先于取指一个周期</text>

    <!-- current PC -->
    <rect x="70" y="118" width="120" height="44" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.6"/>
    <text x="130" y="145" text-anchor="middle" font-size="11.5" fill="#1f2937">当前 PC</text>

    <!-- BPU query -->
    <rect x="240" y="106" width="200" height="68" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="340" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#0e7490">BPU 查询（周期 N）</text>
    <text x="340" y="150" text-anchor="middle" font-size="10" fill="#334155">按取指块查一次，非逐条</text>
    <text x="340" y="164" text-anchor="middle" font-size="10" fill="#334155">五部件并行查询</text>

    <!-- predicted target -->
    <rect x="490" y="118" width="150" height="44" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6"/>
    <text x="565" y="138" text-anchor="middle" font-size="11" fill="#0e7490">预测目标地址</text>
    <text x="565" y="153" text-anchor="middle" font-size="9.5" fill="#6b7280">（方向 × 目标）</text>

    <!-- fetch -->
    <rect x="690" y="118" width="130" height="44" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="1.6"/>
    <text x="755" y="145" text-anchor="middle" font-size="11.5" fill="#0e7490">取指（周期 N+1）</text>

    <!-- L1 BTB hit note -->
    <rect x="870" y="106" width="470" height="68" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4" stroke-dasharray="6 3"/>
    <text x="886" y="130" font-size="10.5" font-weight="700" fill="#c2410c">单周期 taken 的条件（V110）</text>
    <text x="886" y="148" font-size="10" fill="#334155">L1 BTB 64 项命中 + 预测正确 → taken 分支零气泡（理想口径）</text>
    <text x="886" y="164" font-size="10" fill="#334155">密集 taken 链实测 5.8 周期/分支 = 重定向常税（口径辨析 §4.3.1）</text>

    <line x1="190" y1="140" x2="236" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#arw)"/>
    <line x1="440" y1="140" x2="486" y2="140" stroke="#0891b2" stroke-width="2" marker-end="url(#arwC)"/>
    <line x1="640" y1="140" x2="686" y2="140" stroke="#0891b2" stroke-width="2" marker-end="url(#arwC)"/>
  </g>

  <!-- ============ middle: five pieces by branch type ============ -->
  <g>
    <text x="60" y="216" font-size="13.5" font-weight="700" fill="#0e7490">五件套：每类分支语义对应一个专门结构</text>

    <!-- five boxes, y=236..356 -->
    <!-- BTB -->
    <g>
      <rect x="70" y="236" width="236" height="124" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/>
      <text x="188" y="260" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0e7490">BTB（L1+L2 两级）</text>
      <text x="188" y="280" text-anchor="middle" font-size="10.5" fill="#334155">管「跳到哪」——taken 目标</text>
      <line x1="86" y1="292" x2="290" y2="292" stroke="#a5f3fc" stroke-width="1"/>
      <text x="188" y="310" text-anchor="middle" font-size="10" fill="#334155">V110：L1 64 项 / L2 ~2048 项</text>
      <text x="188" y="326" text-anchor="middle" font-size="10" fill="#334155">N1：~4096 项（4-way×1024 idx）</text>
      <text x="188" y="342" text-anchor="middle" font-size="9.5" fill="#6b7280">N1 82-bit 数据宽度亦推断</text>
      <text x="188" y="356" text-anchor="middle" font-size="9" fill="#9ca3af">L1 BTB 64× 差距为最大单项</text>
    </g>
    <!-- direction predictor -->
    <g>
      <rect x="326" y="236" width="236" height="124" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/>
      <text x="444" y="260" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0e7490">方向预测器</text>
      <text x="444" y="280" text-anchor="middle" font-size="10.5" fill="#334155">管「跳不跳」——条件方向</text>
      <line x1="342" y1="292" x2="546" y2="292" stroke="#a5f3fc" stroke-width="1"/>
      <text x="444" y="310" text-anchor="middle" font-size="10" fill="#334155">V110：两级动态（GHB+PHT），近似 A73</text>
      <text x="444" y="326" text-anchor="middle" font-size="10" fill="#334155">N1：GHB ~1024 项 × 96-bit</text>
      <text x="444" y="342" text-anchor="middle" font-size="9.5" fill="#6b7280">V2 世代换 TAGE（gem5 TAGE_SC_L_64KB）</text>
      <text x="444" y="356" text-anchor="middle" font-size="9" fill="#9ca3af">mcf MPKI：16.64 vs 15.03</text>
    </g>
    <!-- RAS -->
    <g>
      <rect x="582" y="236" width="236" height="124" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/>
      <text x="700" y="260" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0e7490">RAS（返回栈）</text>
      <text x="700" y="280" text-anchor="middle" font-size="10.5" fill="#334155">管「返回到哪」——RET 目标</text>
      <line x1="598" y1="292" x2="802" y2="292" stroke="#a5f3fc" stroke-width="1"/>
      <text x="700" y="310" text-anchor="middle" font-size="10" fill="#334155">V110：31–32 项</text>
      <text x="700" y="326" text-anchor="middle" font-size="10" fill="#334155">gem5 V2 官方配置：31 项</text>
      <text x="700" y="342" text-anchor="middle" font-size="9.5" fill="#6b7280">BL/BLR 压栈 · RET 弹栈</text>
      <text x="700" y="356" text-anchor="middle" font-size="9" fill="#9ca3af">跨线程内容几乎必然失效（§4.3.5）</text>
    </g>
    <!-- indirect -->
    <g>
      <rect x="838" y="236" width="236" height="124" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/>
      <text x="956" y="260" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0e7490">间接分支预测器</text>
      <text x="956" y="280" text-anchor="middle" font-size="10.5" fill="#334155">管「寄存器目标跳到哪」</text>
      <line x1="854" y1="292" x2="1058" y2="292" stroke="#a5f3fc" stroke-width="1"/>
      <text x="956" y="310" text-anchor="middle" font-size="10" fill="#334155">V110：每分支 ~16 目标</text>
      <text x="956" y="326" text-anchor="middle" font-size="10" fill="#334155">全局 ~256 间接目标</text>
      <text x="956" y="342" text-anchor="middle" font-size="9.5" fill="#6b7280">N1：BPIQ 64 项（RAMID 0x05）</text>
      <text x="956" y="356" text-anchor="middle" font-size="9" fill="#9ca3af">对应虚函数表/switch 跳表域</text>
    </g>
    <!-- static -->
    <g>
      <rect x="1094" y="236" width="236" height="124" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
      <text x="1212" y="260" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">静态预测器（兜底）</text>
      <text x="1212" y="280" text-anchor="middle" font-size="10.5" fill="#334155">全部动态结构 miss 后启用</text>
      <line x1="1110" y1="292" x2="1314" y2="292" stroke="#ddd6fe" stroke-width="1"/>
      <text x="1212" y="310" text-anchor="middle" font-size="10" fill="#334155">「向后跳 = 循环 = taken」启发</text>
      <text x="1212" y="326" text-anchor="middle" font-size="10" fill="#334155">重要性随预测器规模缩小而↑</text>
      <text x="1212" y="342" text-anchor="middle" font-size="9.5" fill="#6b7280">V110 小 L1 BTB → 更常落静态</text>
      <text x="1212" y="356" text-anchor="middle" font-size="9" fill="#9ca3af">误预测合并在 br_mis_pred，不可分</text>
    </g>

    <!-- branch type legend under five boxes -->
    <g font-size="9.5" fill="#6b7280">
      <text x="188" y="374" text-anchor="middle">← 条件/直接分支</text>
      <text x="444" y="374" text-anchor="middle">← B.cond / CBZ / TBZ</text>
      <text x="700" y="374" text-anchor="middle">← BL / BLR / RET</text>
      <text x="956" y="374" text-anchor="middle">← BR Xn / BLR Xn</text>
      <text x="1212" y="374" text-anchor="middle">← 其余全部</text>
    </g>
  </g>

  <!-- ============ bottom left: coverage ladder ============ -->
  <g>
    <rect x="60" y="396" width="640" height="230" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.4"/>
    <text x="76" y="420" font-size="13" font-weight="700" fill="#0e7490">预测器覆盖域 × 代码工作集的匹配（V110 口径）</text>

    <!-- three coverage tiers as stacked bars -->
    <g font-size="10.5" fill="#334155">
      <rect x="86" y="438" width="120" height="34" rx="4" fill="#a5f3fc"/>
      <text x="146" y="460" text-anchor="middle" font-weight="600">L1 BTB 64 项</text>
      <text x="222" y="450">内层热循环（内核 syscall 路径）</text>
      <text x="222" y="466" font-size="9.5" fill="#059669">风险低——taken &lt; 64 全覆盖，单周期重定向</text>

      <rect x="86" y="484" width="250" height="34" rx="4" fill="#67c3d8"/>
      <text x="211" y="506" text-anchor="middle" font-weight="600">+ L2 BTB ~2048 项</text>
      <text x="352" y="496">中型热点（数据库执行计划 / JIT 热方法）</text>
      <text x="352" y="512" font-size="9.5" fill="#d97706">风险中——L1 溢出靠 L2 兜，数百 KB 代码段</text>

      <rect x="86" y="530" width="560" height="34" rx="4" fill="#0891b2"/>
      <text x="366" y="552" text-anchor="middle" font-weight="600" fill="#ffffff">全部超出 → 静态预测兜底 + 每次 taken 付完整重定向</text>
      <text x="86" y="584" font-size="9.5" fill="#b91c1c">大代码巡回（解释器 dispatch / 编译器 / mcf 指针追逐）：MB 级工作集击穿 BTB 覆盖</text>
      <text x="86" y="600" font-size="9.5" fill="#b91c1c">mcf MPKI 16.64（V110）vs 15.03（N1）——每千条多错 1.6 次 × 每次全冲刷窗口（~108 µop 作废）</text>
    </g>
    <text x="76" y="620" font-size="9" fill="#9ca3af">注：MPKI 为公开 benchmark 报告（社区口径），两机平台配置不完全对齐——量级证据可信，精确差距需标注。</text>
  </g>

  <!-- ============ bottom right: protection asymmetry ============ -->
  <g>
    <rect x="730" y="396" width="610" height="230" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="746" y="420" font-size="13" font-weight="700" fill="#b91c1c">保护矩阵的不对称：预测器 RAM = None（N1 TRM Table 9-1）</text>
    <g font-size="10.5" fill="#334155">
      <rect x="746" y="436" width="260" height="30" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
      <text x="876" y="456" text-anchor="middle" fill="#b91c1c" font-weight="600">L1 BTB / GHB / BPIQ = None</text>
      <rect x="1026" y="436" width="150" height="30" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
      <text x="1101" y="456" text-anchor="middle" fill="#047857" font-weight="600">L1I tag = parity</text>
      <rect x="1190" y="436" width="134" height="30" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
      <text x="1257" y="456" text-anchor="middle" fill="#047857" font-weight="600">L1D = SECDED</text>

      <text x="746" y="492">为什么预测器可以裸奔？错误传播路径的终点不同：</text>
      <text x="762" y="514">· 预测器位翻转 → 误预测 → <tspan font-weight="700" fill="#059669">冲刷重取（性能损失，正确性由 ROB 按序提交兜底）</tspan></text>
      <text x="762" y="536">· L1D 数据位翻转 → 错值直达架构态 → <tspan font-weight="700" fill="#dc2626">SDC（不可恢复）</tspan></text>
      <text x="746" y="560" font-weight="700" fill="#b91c1c">「预测可以错、数据不能错」——保护预算从预测器搬到数据通路</text>
      <text x="746" y="584" font-size="9.5" fill="#6b7280">formal 佐证（gem5 O3，n=384）：BPU/RAS/Decode 落零风险带（L1I 0% 同组），</text>
      <text x="746" y="600" font-size="9.5" fill="#6b7280">L1D 命中数据 97.7%——「预测错误可被冲刷兜住」的设计假设在代理模型里成立（§4.2.3）</text>
    </g>
  </g>

  <!-- ============ footer strip: evidence tiers ============ -->
  <g>
    <rect x="60" y="648" width="1280" height="196" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="76" y="672" font-size="13" font-weight="700" fill="#374151">两列数字的证据等级不同（引用纪律，§4.2.2）</text>
    <g font-size="10.5" fill="#334155">
      <!-- V110 column -->
      <rect x="86" y="688" width="600" height="72" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1"/>
      <text x="102" y="710" font-weight="700" fill="#0e7490">V110（公开微基准 + 本机实测佐证）</text>
      <text x="102" y="730">L1 BTB 64 · L2 BTB ~2048 · RAS 31–32 · 间接 ~16/分支 · ~256 全局</text>
      <text x="102" y="748" font-size="9.5" fill="#6b7280">两级方向预测器近似 A73（行为推断）；µop cache 无（§4.1.2 悬崖根源）</text>
      <!-- N1 column -->
      <rect x="710" y="688" width="610" height="72" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
      <text x="726" y="710" font-weight="700" fill="#6d28d9">N1（RAMINDEX 编码反推——厂商为 FA 公开的 RAM 几何）</text>
      <text x="726" y="730">L1 BTB ~4096（4-way×1024 idx，82-bit）· GHB ~1024×96-bit · BPIQ 64</text>
      <text x="726" y="748" font-size="9.5" fill="#6b7280">TRM 正文从未写「BTB 4096 项」；ERET 不预测是 TRM :1640-1643 明文</text>
      <!-- misprediction cost note -->
      <text x="76" y="784" font-size="10" fill="#6b7280">误预测总账 = 冲刷窗口（ROB ~128 µop，有效 ~108–110）+ 全前端重填；5.8 周期是预测正确时密集 taken 的「常税」口径，罚金另算（§4.3）</text>
      <text x="76" y="802" font-size="10" fill="#6b7280">taken 吞吐上限 1 条/周期（分支走两口）——密集 taken 代码的结构性天花板（§4.3.4）</text>
    </g>
  </g>

  <!-- footer -->
  <text x="30" y="880" font-size="10.5" fill="#9ca3af">图 4-2：分支预测五件套 · 上：预测先于取指的流水 · 中：五部件按分支类型分工（青=BPU 部件，紫=静态兜底）· 左下：覆盖域阶梯 · 右下：保护 None 的理由 · 底：证据等级分层 · 与正文 §4.2.1–4.2.4 对应</text>
</svg>

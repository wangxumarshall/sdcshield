<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 860" width="1380" height="860" font-family="-apple-system,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker>
    <marker id="arwR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
  </defs>

  <rect x="0" y="0" width="1380" height="860" fill="#ffffff"/>

  <text x="30" y="32" font-size="20" font-weight="700" fill="#111827">前端取指带宽悬崖：V110 三级阶梯（无 µop cache）与 N1 L0 MOP 对照</text>
  <text x="30" y="53" font-size="12" fill="#6b7280">4 宽译码的名义 IPC 兑现前提 = 每周期 4 条指令到位 · 1.75/0.25 为公开微基准口径（第 10 章延迟阶梯不可直接换算，标注引用）· 数据出处：kunpeng920_microarchitecture.md / N1 TRM PMU 0x14</text>

  <!-- ================= cliff chart (left) ================= -->
  <g>
    <text x="60" y="100" font-size="13.5" font-weight="700" fill="#0e7490">取指供给带宽（条/周期）随层级骤降</text>
    <!-- axes -->
    <line x1="110" y1="120" x2="110" y2="560" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="110" y1="560" x2="560" y2="560" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arw)"/>
    <text x="66" y="330" font-size="10.5" fill="#6b7280" transform="rotate(-90 66 330)">条指令 / 周期</text>
    <!-- y gridlines: 1,2,3,4 -->
    <g stroke="#f3f4f6" stroke-width="1">
      <line x1="110" y1="460" x2="560" y2="460"/>
      <line x1="110" y1="360" x2="560" y2="360"/>
      <line x1="110" y1="260" x2="560" y2="260"/>
      <line x1="110" y1="160" x2="560" y2="160"/>
    </g>
    <g font-size="10" fill="#9ca3af" text-anchor="end">
      <text x="102" y="464">1</text><text x="102" y="364">2</text><text x="102" y="264">3</text><text x="102" y="164">4</text>
    </g>
    <!-- decode width demand line at 4 -->
    <line x1="110" y1="160" x2="540" y2="160" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 4"/>
    <text x="546" y="156" font-size="10.5" fill="#dc2626" font-weight="600">4 宽译码消化线</text>
    <text x="546" y="170" font-size="9" fill="#dc2626">低于此线 → 后端饿</text>

    <!-- bars: L1I=4.0, L2=1.75, L3/mem=0.25; scale: 100px/unit (grid 1@460..4@160), baseline y=560 -->
    <g>
      <rect x="150" y="160" width="90" height="400" fill="#0891b2" rx="3"/>
      <text x="195" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">4.0</text>
      <rect x="290" y="385" width="90" height="175" fill="#67c3d8" rx="3"/>
      <text x="335" y="373" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">~1.75</text>
      <rect x="430" y="535" width="90" height="25" fill="#bae6fd" rx="3"/>
      <text x="475" y="523" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">~0.25</text>
    </g>
    <!-- x labels -->
    <g font-size="11.5" text-anchor="middle" fill="#334155">
      <text x="195" y="584">L1I 命中</text>
      <text x="195" y="600" font-size="9.5" fill="#6b7280">64KB 驻留</text>
      <text x="335" y="584">L2 供给</text>
      <text x="335" y="600" font-size="9.5" fill="#6b7280">溢出 L1I 后</text>
      <text x="475" y="584">L3 / 内存</text>
      <text x="475" y="600" font-size="9.5" fill="#6b7280">溢出 L2 后</text>
    </g>
    <!-- relative annotations -->
    <g font-size="10" fill="#dc2626" text-anchor="middle">
      <text x="335" y="403">0.44×（-56%）</text>
      <text x="475" y="553">0.06×（-94%）</text>
    </g>
    <!-- cliff arrows -->
    <path d="M 246 200 C 272 200, 282 320, 290 378" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arwR)"/>
    <path d="M 386 400 C 410 400, 420 470, 428 528" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arwR)"/>
    <text x="268" y="295" font-size="10.5" fill="#dc2626" transform="rotate(63 268 295)">悬崖 1</text>
    <text x="402" y="468" font-size="10.5" fill="#dc2626" transform="rotate(58 402 468)">悬崖 2</text>
  </g>

  <!-- ================= N1 MOP cache bypass (right) ================= -->
  <g>
    <text x="640" y="100" font-size="13.5" font-weight="700" fill="#065f46">N1 的兜底：L0 宏操作缓存旁路（推断）</text>
    <!-- V110 path: L1I -> fetch -> decode -->
    <g font-size="10.5">
      <rect x="660" y="130" width="130" height="40" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6"/>
      <text x="725" y="154" text-anchor="middle" fill="#0e7490">L1I（无 µop cache）</text>
      <rect x="830" y="130" width="110" height="40" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="1.6"/>
      <text x="885" y="154" text-anchor="middle" fill="#0e7490">取指 + 译码</text>
      <rect x="980" y="130" width="130" height="40" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="1.6"/>
      <text x="1045" y="154" text-anchor="middle" fill="#0e7490">重命名/派遣</text>
      <line x1="790" y1="150" x2="826" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#arw)"/>
      <line x1="940" y1="150" x2="976" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#arw)"/>
      <!-- cliff annotation under V110 path -->
      <text x="885" y="196" text-anchor="middle" font-size="9.5" fill="#dc2626">L1I miss → 带宽掉到 1.75/0.25</text>
      <text x="885" y="210" text-anchor="middle" font-size="9.5" fill="#dc2626">每条指令重新流过译码器</text>
    </g>
    <!-- N1 path: L0 MOP bypass -->
    <g font-size="10.5">
      <rect x="660" y="250" width="130" height="40" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
      <text x="725" y="274" text-anchor="middle" fill="#047857">L1I 64KB</text>
      <rect x="660" y="330" width="130" height="40" rx="6" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
      <text x="725" y="348" text-anchor="middle" fill="#065f46" font-weight="700">L0 MOP cache</text>
      <text x="725" y="362" text-anchor="middle" font-size="9" fill="#065f46">（已译码宏操作）</text>
      <rect x="830" y="330" width="110" height="40" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
      <text x="885" y="354" text-anchor="middle" fill="#047857">绕过译码</text>
      <rect x="980" y="330" width="130" height="40" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
      <text x="1045" y="354" text-anchor="middle" fill="#047857">重命名/派遣</text>
      <!-- L1I miss falls to L0 -->
      <line x1="725" y1="290" x2="725" y2="326" stroke="#059669" stroke-width="2" marker-end="url(#arwG)"/>
      <text x="737" y="312" font-size="9.5" fill="#059669">miss → L0 兜底</text>
      <line x1="790" y1="350" x2="826" y2="350" stroke="#059669" stroke-width="2" marker-end="url(#arwG)"/>
      <line x1="940" y1="350" x2="976" y2="350" stroke="#059669" stroke-width="2" marker-end="url(#arwG)"/>
      <!-- evidence box -->
      <rect x="660" y="410" width="450" height="106" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.2" stroke-dasharray="6 3"/>
      <text x="676" y="432" font-size="10.5" font-weight="700" fill="#065f46">证据与推断等级（引用纪律）</text>
      <text x="676" y="450" font-size="10" fill="#334155">· TRM PMU 0x14 描述："L1I_CACHE: Level 1 instruction cache access,</text>
      <text x="676" y="466" font-size="10" fill="#334155">  or Level 0 Macro-op cache access"——唯一明证</text>
      <text x="676" y="484" font-size="10" fill="#6b7280">· TRM 正文无 MOP cache 结构章节 → 从 PMU 事件描述反推的结构</text>
      <text x="676" y="502" font-size="10" fill="#6b7280">  结论，引用时须标注推断等级</text>
    </g>
  </g>

  <!-- ================= bottom: injured code + comparison ================= -->
  <g>
    <rect x="60" y="620" width="620" height="180" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
    <text x="76" y="644" font-size="13" font-weight="700" fill="#c2410c">多大的代码会受伤？（V110 口径换算）</text>
    <g font-size="11" fill="#334155">
      <text x="76" y="672">· L1I 供给：2.6GHz × 4 条/周期 = <tspan font-weight="700">10.4B 指令/秒</tspan></text>
      <text x="76" y="694">· L1I 驻留：64KB ÷ 4B/条 = <tspan font-weight="700">16K 条指令</tspan>（约 4–5 千行 C）</text>
      <text x="76" y="716">· 热代码超过 16K 条 → 开始付 L2 取指税（1.75 条/周期）</text>
      <text x="76" y="738">· MB 级热代码（数据库执行计划、解释器 dispatch 循环、JIT）：</text>
      <text x="92" y="758" fill="#b91c1c" font-weight="600">V110 全额缴税；N1 有 L0 MOP cache 部分兜底</text>
    </g>
    <!-- data-side vs instruction-side comparison -->
    <rect x="710" y="620" width="610" height="180" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.6"/>
    <text x="726" y="644" font-size="13" font-weight="700" fill="#047857">与数据侧悬崖对照（前端的更裸露）</text>
    <g font-size="11" fill="#334155">
      <text x="726" y="672">· 数据侧 L1D→L2：4c→10c（2.5× 降速），但<tspan font-weight="600">有预取器补偿</tspan>（第 6 章）</text>
      <text x="726" y="694">· 取指侧 L1I→L2：4→1.75 条（2.3× 降速），<tspan font-weight="600">无指令预取器普遍配置</tspan></text>
      <text x="726" y="716">· N1 的 PLI 仅是 L1I+L2 双 miss 时的单发预取（§4.4）</text>
      <text x="726" y="738" fill="#b91c1c" font-weight="600">→ 前端带宽悬崖比数据侧更裸露，是 V110 前端最大结构性弱点</text>
      <text x="726" y="766" font-size="10" fill="#6b7280">（后端 4 宽的饥饿点 = STALL_BACKEND 反面：STALL_FRONTEND 0x23 观测）</text>
    </g>
  </g>

  <!-- footer -->
  <text x="30" y="840" font-size="10.5" fill="#9ca3af">图 4-1：前端取指带宽悬崖 · 青色柱=V110 三级供给（4 → 1.75 → 0.25 条/周期）· 红虚线=4 宽译码消化线 · 右上=N1 L0 MOP cache 旁路（推断等级已标）· 与正文 §4.1.2 表格对应</text>
</svg>

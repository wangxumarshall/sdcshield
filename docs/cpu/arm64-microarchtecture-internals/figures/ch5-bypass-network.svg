<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" width="1400" height="880" font-family="-apple-system,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker>
    <marker id="arwO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
    <marker id="arwR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
  </defs>

  <rect x="0" y="0" width="1400" height="880" fill="#ffffff"/>

  <text x="30" y="32" font-size="20" font-weight="700" fill="#111827">旁路网络：背靠背链不写 PRF——forwarding 掩蔽定律的硬件现场</text>
  <text x="30" y="53" font-size="12" fill="#6b7280">A→B 背靠背链的结果走纯导线+传输门直达 B 的输入锁存器 · 旁路矩阵无 ECC/parity · 数据出处：gem5 CHAOSFPU 演化史（dyn_inst.hh:1177/1185-1188）+ formal n=384 + cpu-sdc.md 敏感单元之三</text>

  <!-- ============ top: dual path mechanism ============ -->
  <g>
    <text x="60" y="96" font-size="13.5" font-weight="700" fill="#c2410c">双路径：A 执行完毕后，结果去哪</text>

    <!-- producer A -->
    <rect x="80" y="126" width="150" height="60" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="155" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">A 执行完毕</text>
    <text x="155" y="168" text-anchor="middle" font-size="10" fill="#6b7280">结果在输出锁存器</text>

    <!-- fork point -->
    <path d="M 230 156 L 280 156" fill="none" stroke="#374151" stroke-width="2"/>
    <path d="M 280 156 L 280 118 L 280 118" fill="none" stroke="#374151" stroke-width="2"/>

    <!-- upper path: PRF write -->
    <path d="M 280 118 L 340 118" fill="none" stroke="#9ca3af" stroke-width="2"/>
    <rect x="340" y="92" width="240" height="52" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/>
    <text x="460" y="112" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6b7280">路径①：PRF 写端口</text>
    <text x="460" y="130" text-anchor="middle" font-size="9.5" fill="#6b7280">保存结果 · 供远期消费者读（晚到的 C/D）</text>
    <line x1="580" y1="118" x2="660" y2="118" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arw)"/>
    <text x="620" y="110" text-anchor="middle" font-size="9" fill="#9ca3af">晚到消费者</text>

    <!-- lower path: bypass -->
    <path d="M 280 194 L 340 194" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arwO)"/>
    <rect x="340" y="162" width="240" height="64" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2"/>
    <text x="460" y="184" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c2410c">路径②：旁路网络（本图主角）</text>
    <text x="460" y="202" text-anchor="middle" font-size="9.5" fill="#334155">纯导线 + 传输门互连矩阵</text>
    <text x="460" y="216" text-anchor="middle" font-size="9.5" fill="#b91c1c">无 ECC · 无 parity · 无任何保护</text>
    <line x1="580" y1="194" x2="660" y2="194" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arwO)"/>
    <rect x="660" y="162" width="180" height="64" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="750" y="186" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c2410c">B 执行单元输入</text>
    <text x="750" y="204" text-anchor="middle" font-size="9.5" fill="#334155">下周期即用（背靠背）</text>

    <!-- timing contrast -->
    <rect x="900" y="92" width="440" height="134" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="916" y="114" font-size="11.5" font-weight="700" fill="#374151">走 PRF 会怎样（反事实）</text>
    <g font-size="10" fill="#334155">
      <text x="916" y="136">A 写 PRF（写端口 + 写穿透）→ B 读 PRF（读端口 + 读延迟）</text>
      <text x="916" y="156">环路至少 2-3 周期 → <tspan font-weight="700" fill="#b91c1c">背靠背吞吐不复存在</tspan></text>
      <text x="916" y="180">旁路网络把这段压缩到：A 完成 → 互连线传播 → B 输入锁存</text>
      <text x="916" y="200" font-weight="700" fill="#0e7490">这是调度器 1 周期环路（图 5-1）能成立的物理前提</text>
    </g>

    <!-- fork connector: from A box to both paths -->
    <path d="M 230 156 L 280 156 L 280 118" fill="none" stroke="#374151" stroke-width="2"/>
    <path d="M 230 156 L 280 156 L 280 194" fill="none" stroke="#374151" stroke-width="2"/>
  </g>

  <!-- ============ middle left: three-generation injector ============ -->
  <g>
    <text x="60" y="266" font-size="13.5" font-weight="700" fill="#c2410c">gem5 三代注入器演化：旁路存在的源码铁证（CHAOSFPU）</text>

    <g>
      <rect x="70" y="284" width="380" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
      <text x="86" y="306" font-size="11.5" font-weight="700" fill="#b91c1c">v1：挂 ROB 头采样</text>
      <g font-size="10" fill="#334155">
        <text x="86" y="328">5089/5089 次采样全部 "result already popped"</text>
        <text x="86" y="348">—— 执行结果早已离开 ROB，采样点错过一切</text>
        <text x="86" y="376" fill="#b91c1c" font-weight="600">结局：注入器位置错误（非机制不存在）</text>
      </g>

      <rect x="490" y="284" width="380" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
      <text x="506" y="306" font-size="11.5" font-weight="700" fill="#b91c1c">v2：挂写回（setRegOperand）</text>
      <g font-size="10" fill="#334155">
        <text x="506" y="328">背靠背链根本不写 PRF（值走旁路）</text>
        <text x="506" y="348">注入大量落空——写路径上没有消费者要的值</text>
        <text x="506" y="376" fill="#b91c1c" font-weight="600">结局：证明"背靠背不写 PRF"（否定性证据）</text>
      </g>

      <rect x="910" y="284" width="430" height="120" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
      <text x="926" y="306" font-size="11.5" font-weight="700" fill="#047857">v3：挂源读取（getRegOperand）✓</text>
      <g font-size="10" fill="#334155">
        <text x="926" y="328">每次消费都命中——read hook 看见每一次操作数获取</text>
        <text x="926" y="350" font-style="italic" fill="#065f46">"this is the ONLY reliable corruption point for back-to-back</text>
        <text x="926" y="366" font-style="italic" fill="#065f46">dependency chains — PRF cell injection is defeated by</text>
        <text x="926" y="382" font-style="italic" fill="#065f46">operand forwarding"</text>
        <text x="926" y="400" fill="#047857" font-weight="600">结局：定位唯一可靠污染点（dyn_inst.hh:1185-1188）</text>
      </g>
    </g>
  </g>

  <!-- ============ middle right: masking law ============ -->
  <g>
    <rect x="70" y="428" width="620" height="130" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
    <text x="86" y="450" font-size="12.5" font-weight="700" fill="#047857">forwarding 掩蔽定律（formal 实证，n=384）</text>
    <g font-size="10.5" fill="#334155">
      <text x="86" y="474">PRF 位翻转的架构可见性 = f(生产者-消费者距离)</text>
      <text x="86" y="496">· 背靠背转发距离内：消费者对 PRF 的读取次数 = 0 → 坏值无传播通道</text>
      <text x="86" y="518">· H1 闭环：P(SDC | reads&gt;0) = 1.000，reads 中位数 197.5 万</text>
      <text x="86" y="542" fill="#047857" font-weight="600">→ 无 ECC 的 PRF 相当一部分软错误被旁路网络"天然消毒"——不是检测，是绕过</text>
    </g>

    <rect x="730" y="428" width="610" height="130" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
    <text x="746" y="450" font-size="12.5" font-weight="700" fill="#b45309">程序形态学推论（三维决定论首秀）</text>
    <g font-size="10.5" fill="#334155">
      <text x="746" y="474">紧凑依赖链（FMA 链）：转发距离内读取少 → PRF 翻转可见性低</text>
      <text x="746" y="496">松散跨基本块流（生产者早已退休）：消费者真读 PRF → 可见性高</text>
      <text x="746" y="518">· PRF X3 累加器（故意拉长读写距离）：全 8 位段 P_SDC = 1.0000</text>
      <text x="746" y="540">· PRF 低位自然负载注入：仅 3.9% SDC（多数被 forwarding 掩蔽）</text>
    </g>
  </g>

  <!-- ============ bottom: scoreboard + scale account ============ -->
  <g>
    <text x="60" y="592" font-size="13.5" font-weight="700" fill="#c2410c">记分牌裁决：操作数来源三选一</text>

    <!-- scoreboard -->
    <g>
      <rect x="70" y="610" width="560" height="120" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
      <text x="86" y="632" font-size="11.5" font-weight="700" fill="#c2410c">O3Scoreboard：逐物理寄存器一个就绪位</text>
      <g font-size="10" fill="#334155">
        <text x="86" y="656">① 已写回 PRF → 直接读　② 本周期有旁路值到达 → 截获</text>
        <text x="86" y="676">③ 生产者还在飞 → 等待（挂 IQ 依赖链）</text>
        <text x="86" y="700">rename 级查它决定入 IQ 时哪些源就绪；IEW 内 regScoreboard 缓存</text>
        <text x="86" y="718">减少重复查询（inst_queue.hh:533）</text>
      </g>
      <!-- two outcomes -->
      <rect x="380" y="646" width="230" height="72" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="396" y="666" font-size="9.5" font-weight="700" fill="#b91c1c">就绪位翻转的两种结局</text>
      <g font-size="9.5" fill="#334155">
        <text x="396" y="684">假就绪 → 读旧值/垃圾（过期值捕获）</text>
        <text x="396" y="700">假未就绪 → 死等已完成寄存器（Hang）</text>
        <text x="396" y="714" fill="#b91c1c">CHAOSIQ src_ready_bitflip 可分离实验</text>
      </g>
    </g>

    <!-- scale account -->
    <g>
      <rect x="670" y="610" width="670" height="120" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4"/>
      <text x="686" y="632" font-size="11.5" font-weight="700" fill="#374151">旁路矩阵的规模账（4 宽整核示意）——为什么它无保护也"必须"无保护</text>
      <g font-size="10" fill="#334155">
        <text x="686" y="656">生产者源 ~6-8（3 ALU + MUL/DIV + 2 AGU/load + FP0/FP1）</text>
        <text x="686" y="676">消费者汇 ~12-16（每单元 2-3 操作数输入）→ 交叉点 6×14 ≈ 84 条路径</text>
        <text x="686" y="696">每路径 64-bit（整数）/128-bit（NEON）→ 数千 bit 导线+传输门矩阵</text>
        <text x="686" y="720" fill="#b45309" font-weight="600">加 parity：面积+延迟双重惩罚，而受益面已被掩蔽定律部分抵消</text>
        <text x="686" y="736" font-size="9.5" fill="#b91c1c">→ 设计哲学：错误代价只是重算时，不值得为正确性付费（与预测器 None 同源；F5 边界见第 9 章）</text>
      </g>
    </g>
  </g>

  <!-- footer -->
  <text x="30" y="790" font-size="10.5" fill="#9ca3af">图 5-2：旁路网络 · 上：双路径机制（橙=旁路主线，灰=PRF 保存线）· 中：三代注入器（红=失败实验，绿=成功定位）+ 掩蔽定律/形态学推论 · 下：记分牌三选一 + 规模账 · 与正文 §5.4 对应</text>
  <text x="30" y="812" font-size="9.5" fill="#d1d5db">诚实边界：V110 旁路网络拓扑与记分牌细节未公开；规模账为 4 宽示意口径；gem5 结论为代理模型条件概率（gem5≠RTL）</text>
</svg>

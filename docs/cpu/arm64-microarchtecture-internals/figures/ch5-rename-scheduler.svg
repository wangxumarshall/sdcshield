<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" width="1400" height="940" font-family="-apple-system,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker>
    <marker id="arwO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
    <marker id="arwR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
  </defs>

  <rect x="0" y="0" width="1400" height="940" fill="#ffffff"/>

  <text x="30" y="32" font-size="20" font-weight="700" fill="#111827">重命名三方联动与唤醒-选择环路：乱序中枢的两台核心机器</text>
  <text x="30" y="53" font-size="12" fill="#6b7280">上：RAT/FreeList/历史缓冲三句话机制（gem5 RenameHistory 标本）· 中：两张 RAT 分工 · 下：调度器环路延迟与分布式路线 · 数据出处：kunpeng920 微架构（社区口径）/ gem5 O3 源码 / V2 官方配置</text>

  <!-- ============ top: rename three-party interaction ============ -->
  <g>
    <text x="60" y="96" font-size="13.5" font-weight="700" fill="#c2410c">重命名三句话 = 三块硬件（写 X1 的指令 D 为例）</text>

    <!-- FreeList -->
    <g>
      <rect x="70" y="116" width="220" height="110" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
      <text x="180" y="140" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">FreeList（空闲池）</text>
      <text x="180" y="160" text-anchor="middle" font-size="10" fill="#334155">① D 写 Ra → 弹出新 Pn</text>
      <text x="180" y="178" text-anchor="middle" font-size="10" fill="#334155">③ D 退休 → 旧 Pp 归还</text>
      <text x="180" y="198" text-anchor="middle" font-size="9.5" fill="#6b7280">gem5: std::queue&lt;PhysRegIdPtr&gt;</text>
      <text x="180" y="214" text-anchor="middle" font-size="9.5" fill="#6b7280">free_list.hh:76</text>
    </g>

    <!-- RAT -->
    <g>
      <rect x="360" y="116" width="260" height="110" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
      <text x="490" y="140" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">RAT（架构→物理映射表）</text>
      <text x="490" y="160" text-anchor="middle" font-size="10" fill="#334155">Ra: Pp → Pn（D 此后写 Pn）</text>
      <text x="490" y="178" text-anchor="middle" font-size="10" fill="#334155">WAW/WAR 假依赖就此消除</text>
      <text x="490" y="198" text-anchor="middle" font-size="9.5" fill="#6b7280">前端 RAT（投机）+ 提交 RAT（架构）</text>
      <text x="490" y="214" text-anchor="middle" font-size="9.5" fill="#6b7280">cpu.hh:452-456</text>
    </g>

    <!-- History buffer -->
    <g>
      <rect x="690" y="116" width="280" height="110" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
      <text x="830" y="140" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">历史缓冲（回滚依据）</text>
      <text x="830" y="160" text-anchor="middle" font-size="10" fill="#334155">② 压入 (序号, Ra, Pn, Pp) 四元组</text>
      <text x="830" y="178" text-anchor="middle" font-size="10" fill="#334155">误预测 → 沿缓冲向老方向逐条回滚</text>
      <text x="830" y="198" text-anchor="middle" font-size="9.5" fill="#6b7280">gem5 RenameHistory, rename.hh:311</text>
      <text x="830" y="214" text-anchor="middle" font-size="9.5" fill="#6b7280">checkpoint 网络 = 周期级快速回滚（§5.2.5）</text>
    </g>

    <!-- PRF note -->
    <g>
      <rect x="1040" y="116" width="300" height="110" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.4" stroke-dasharray="6 3"/>
      <text x="1190" y="140" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c2410c">PRF 的双重角色（merged file）</text>
      <text x="1190" y="160" text-anchor="middle" font-size="10" fill="#334155">架构寄存器（提交 RAT 指认）</text>
      <text x="1190" y="176" text-anchor="middle" font-size="10" fill="#334155">+ 在飞指令的暂存目的地</text>
      <text x="1190" y="196" text-anchor="middle" font-size="9.5" fill="#6b7280">V110：整数 PRF ~128 ≈ ROB ~128 紧平衡</text>
      <text x="1190" y="212" text-anchor="middle" font-size="9.5" fill="#6b7280">V2：int 213 / float 188 vs ROB 320</text>
    </g>

    <!-- arrows between three -->
    <line x1="290" y1="160" x2="356" y2="160" stroke="#ea580c" stroke-width="2" marker-end="url(#arwO)"/>
    <line x1="620" y1="160" x2="686" y2="160" stroke="#ea580c" stroke-width="2" marker-end="url(#arwO)"/>
    <line x1="690" y1="196" x2="626" y2="196" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arwO)"/>
    <text x="658" y="190" font-size="8.5" fill="#c2410c" text-anchor="middle">回滚</text>

    <!-- lifecycle strip -->
    <rect x="70" y="246" width="1270" height="30" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="705" y="266" text-anchor="middle" font-size="10.5" fill="#92400e">物理寄存器生命周期：<tspan font-weight="700">分配于重命名（①）→ 在飞持有（②记账）→ 死亡于下一个写者的提交（③归还）</tspan>——"判死"与"停止读写"不同时，故有 freeingInProgress 延迟归还（rename.cc:968-976）</text>
  </g>

  <!-- ============ middle: two RATs ============ -->
  <g>
    <text x="60" y="312" font-size="13.5" font-weight="700" fill="#c2410c">两张 RAT：架构态真相 vs 投机视图</text>
    <!-- front RAT -->
    <g>
      <rect x="70" y="328" width="410" height="104" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
      <text x="86" y="350" font-size="12" font-weight="700" fill="#c2410c">前端 RAT（投机）</text>
      <g font-size="10" fill="#334155">
        <text x="86" y="372">· 更新：重命名级，指令到达即改</text>
        <text x="86" y="390">· 内容：含全部在飞指令的投机写</text>
        <text x="86" y="408">· 读者：在飞指令的源操作数查找</text>
        <text x="86" y="424" fill="#b91c1c">· 误预测 → 沿历史缓冲重建（可回滚）</text>
      </g>
    </g>
    <!-- commit RAT -->
    <g>
      <rect x="510" y="328" width="410" height="104" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.6"/>
      <text x="526" y="350" font-size="12" font-weight="700" fill="#047857">提交 RAT（架构态真相）</text>
      <g font-size="10" fill="#334155">
        <text x="526" y="372">· 更新：指令退休时（commit.cc:1264）</text>
        <text x="526" y="390">· 内容：只含已退休的映射</text>
        <text x="526" y="408">· 读者：异常/中断/上下文切换导出</text>
        <text x="526" y="424" fill="#047857">· 永不回滚（提交不撤销）</text>
      </g>
    </g>
    <!-- invariant -->
    <g>
      <rect x="950" y="328" width="390" height="104" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.2"/>
      <text x="966" y="350" font-size="11.5" font-weight="700" fill="#374151">天然不变量</text>
      <g font-size="10" fill="#334155">
        <text x="966" y="372">两张表的分歧 = 在飞指令数</text>
        <text x="966" y="390">异常导出架构态永远以提交 RAT 为准</text>
        <text x="966" y="408" font-size="9.5" fill="#6b7280">move elimination：RAT 映射直接复指（零周期传送，</text>
        <text x="966" y="424" font-size="9.5" fill="#6b7280">FreeList 不减——共享物理寄存器是 P0 级敏感单元成因）</text>
      </g>
    </g>
  </g>

  <!-- ============ bottom: wakeup-select loop ============ -->
  <g>
    <text x="60" y="470" font-size="13.5" font-weight="700" fill="#c2410c">唤醒-选择环路：背靠背吞吐的心跳</text>

    <!-- the loop: wakeup -> select -> issue -> execute -> back -->
    <g>
      <rect x="90" y="492" width="270" height="72" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
      <text x="225" y="516" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">唤醒 wakeup</text>
      <text x="225" y="536" text-anchor="middle" font-size="10" fill="#334155">生产者广播目的物理寄存器号</text>
      <text x="225" y="552" text-anchor="middle" font-size="10" fill="#334155">等待该寄存器的消费者标记就绪</text>

      <rect x="440" y="492" width="270" height="72" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
      <text x="575" y="516" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">选择 select</text>
      <text x="575" y="536" text-anchor="middle" font-size="10" fill="#334155">就绪集合按年龄/端口仲裁</text>
      <text x="575" y="552" text-anchor="middle" font-size="10" fill="#334155">挑出本周期 ≤width 条发射</text>

      <rect x="790" y="492" width="200" height="72" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
      <text x="890" y="516" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">执行</text>
      <text x="890" y="536" text-anchor="middle" font-size="10" fill="#334155">读操作数 → EU</text>
      <text x="890" y="552" text-anchor="middle" font-size="9.5" fill="#6b7280">（旁路网络 §5.4）</text>

      <!-- loop arrows -->
      <line x1="360" y1="528" x2="436" y2="528" stroke="#ea580c" stroke-width="2" marker-end="url(#arwO)"/>
      <line x1="710" y1="528" x2="786" y2="528" stroke="#ea580c" stroke-width="2" marker-end="url(#arwO)"/>
      <!-- feedback path: from execute bottom back to wakeup -->
      <path d="M 890 564 L 890 596 L 225 596 L 225 568" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="2 0" marker-end="url(#arwO)"/>
      <text x="557" y="590" text-anchor="middle" font-size="9.5" fill="#c2410c">1–2 周期后完成/广播（环路延迟 = 背靠背链每链步的周期数）</text>

      <!-- speculative wakeup note -->
      <rect x="1040" y="492" width="300" height="72" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 3"/>
      <text x="1190" y="512" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">推测唤醒（提前广播）</text>
      <text x="1190" y="530" text-anchor="middle" font-size="9.5" fill="#334155">生产者还在执行时提前唤醒消费者</text>
      <text x="1190" y="546" text-anchor="middle" font-size="9.5" fill="#334155">代价：延迟不固定（除法早退/L1 miss）要撤销</text>
      <text x="1190" y="560" text-anchor="middle" font-size="9" fill="#b91c1c">CHAOSIQ wake_omit/wake_phase 攻击撤销逻辑</text>
    </g>

    <!-- loop latency callout -->
    <g font-size="10" fill="#334155">
      <rect x="90" y="612" width="590" height="34" rx="5" fill="#f9fafb" stroke="#9ca3af" stroke-width="1"/>
      <text x="385" y="633" text-anchor="middle">环路 1 周期 → 背靠背链每周期前进一条（理想）；2 周期 → 吞吐减半。V110 环路延迟未公开（诚实标注）</text>
    </g>
  </g>

  <!-- ============ bottom: three routes table ============ -->
  <g>
    <text x="60" y="682" font-size="13.5" font-weight="700" fill="#c2410c">集中式 vs 分布式：唤醒-选择电路随队列深度超线性增长（比较器 O(D×广播宽度)）</text>

    <!-- three route cards -->
    <g>
      <rect x="70" y="700" width="380" height="130" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
      <text x="86" y="722" font-size="11.5" font-weight="700" fill="#374151">集中式大保留站 — Intel</text>
      <g font-size="10" fill="#334155">
        <text x="86" y="744">单一 IQ，所有类型共用</text>
        <text x="86" y="762">宽发射下唤醒-选择延迟高，频率受限</text>
        <text x="86" y="784" fill="#6b7280">4 宽 × 60 项集中队列 @3GHz 已极紧张</text>
        <text x="86" y="814" font-size="9.5" fill="#9ca3af">V110 不在此列（三类分立）</text>
      </g>

      <rect x="470" y="700" width="380" height="130" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.6"/>
      <text x="486" y="722" font-size="11.5" font-weight="700" fill="#0e7490">按类型分离 — V110 / AMD Zen</text>
      <g font-size="10" fill="#334155">
        <text x="486" y="744">V110：ALU / 访存 / FP·向量 三类统一式各 ~33 项</text>
        <text x="486" y="762">队列内部不再按执行单元细分（ALU 队列共享 3 口）</text>
        <text x="486" y="784" fill="#0e7490">合计 ~99 µop 调度容量——调度器不是 V110 瓶颈</text>
        <text x="486" y="810" font-size="9.5" fill="#6b7280">代价：乘法 4 周期在统一 ALU 队列拖累简单加减的调度观测</text>
      </g>

      <rect x="870" y="700" width="470" height="130" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.6"/>
      <text x="886" y="722" font-size="11.5" font-weight="700" fill="#047857">多独立小队列 — Neoverse V2（gem5 官方配置佐证）</text>
      <g font-size="10" fill="#334155">
        <text x="886" y="744">9 个分立 IQ：简单整 ×2（各 22）· 复杂整 ×2（各 22）</text>
        <text x="886" y="762">FP/向量 ×2（各 28）· load/store ×3（各 16，最小）</text>
        <text x="886" y="784" fill="#047857">每队列小 → 本地环路短 → 8–10 宽仍 3GHz+</text>
        <text x="886" y="810" font-size="9.5" fill="#6b7280">简单/复杂分列 = 按执行延迟的二级拆分（慢指令不占快队列）；仿真配置非 RTL 逐项相等</text>
      </g>
    </g>

    <!-- gem5 specimen note -->
    <rect x="70" y="848" width="1270" height="56" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="86" y="868" font-size="10.5" font-weight="700" fill="#374151">gem5 标本：DependencyGraph——每个物理寄存器号一条等待链（数据触发式调度的本质：全部状态 = 谁在等哪个寄存器）</text>
    <text x="86" y="888" font-size="10" fill="#6b7280">wakeDependents 弹链 markSrcRegReady → 按类 priority_queue + listOrder 跨类年龄兜底（inst_queue.cc:1078-1096）；CAM 式 IQ 与链表依赖图算法同构——CAM = "源寄存器号与广播号并行比较"的电路化版本</text>
  </g>

  <!-- footer -->
  <text x="30" y="926" font-size="10.5" fill="#9ca3af">图 5-1：重命名三方联动与唤醒-选择环路 · 橙=乱序中枢（RAT/FreeList/历史缓冲/IQ 环路）· 绿=架构态真相/V2 路线 · 红=故障注入攻击面 · 与正文 §5.2–5.3 对应</text>
</svg>

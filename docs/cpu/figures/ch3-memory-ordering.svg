<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="-apple-system,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker>
    <marker id="arwC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
  </defs>

  <rect x="0" y="0" width="1440" height="900" fill="#ffffff"/>

  <!-- title -->
  <text x="30" y="32" font-size="20" font-weight="700" fill="#111827">ARMv8 内存序谱系：从 NORMAL 到 LD64B 的七级阶梯</text>
  <text x="30" y="53" font-size="12" fill="#6b7280">每升一级 = LSQ/MOB 多一层跟踪结构（依赖预测 → 监视器 → 排序过滤器 → 年龄矩阵分档）· 既是硬件成本阶梯，也是软件合同阶梯 · 数据出处：armv8-isa 文档集 / N1 TRM / V110 实测 ID 寄存器</text>

  <!-- ladder: 7 steps rising left→right -->
  <!-- step geometry: step i at x = 60 + i*186, height rises -->
  <g font-size="11">
    <!-- Step 0 NORMAL -->
    <g>
      <rect x="60" y="700" width="172" height="120" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
      <text x="146" y="722" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">0 · NORMAL</text>
      <text x="146" y="740" text-anchor="middle" font-size="10" fill="#334155">LDR / STR / LDP / STP</text>
      <text x="146" y="756" text-anchor="middle" font-size="10" fill="#334155">v8.0 · 无序约束</text>
      <text x="146" y="776" text-anchor="middle" font-size="9.5" fill="#065f46">靠显式屏障（DMB/DSB）</text>
      <text x="146" y="792" text-anchor="middle" font-size="9.5" fill="#065f46">依赖预测 StoreSet 兜底</text>
      <text x="146" y="808" text-anchor="middle" font-size="9" fill="#6b7280">MOB：自由乱序 + 违规回滚</text>
    </g>
    <!-- Step 1 ATOMIC -->
    <g>
      <rect x="246" y="646" width="172" height="120" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
      <text x="332" y="668" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">1 · ATOMIC</text>
      <text x="332" y="686" text-anchor="middle" font-size="10" fill="#334155">LDXR / STXR（LL/SC）</text>
      <text x="332" y="702" text-anchor="middle" font-size="10" fill="#334155">v8.0 · 独占监视器</text>
      <text x="332" y="722" text-anchor="middle" font-size="9.5" fill="#065f46">监视器状态机（2-state）</text>
      <text x="332" y="738" text-anchor="middle" font-size="9.5" fill="#065f46">reservation 与 squash 重放</text>
      <text x="332" y="754" text-anchor="middle" font-size="9" fill="#6b7280">争用活锁 → LSE 动机</text>
    </g>
    <!-- Step 2 ORDERED-ATOMIC -->
    <g>
      <rect x="432" y="592" width="172" height="120" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/>
      <text x="518" y="614" text-anchor="middle" font-size="12" font-weight="700" fill="#0e7490">2 · ORD-ATOMIC</text>
      <text x="518" y="632" text-anchor="middle" font-size="10" fill="#334155">LDAXR / STLXR</text>
      <text x="518" y="648" text-anchor="middle" font-size="10" fill="#334155">v8.0 · LL/SC + acq/rel</text>
      <text x="518" y="668" text-anchor="middle" font-size="9.5" fill="#0e7490">1 级之上叠加 3 级排序</text>
      <text x="518" y="684" text-anchor="middle" font-size="9" fill="#6b7280">监视器 + 排序过滤器</text>
    </g>
    <!-- Step 3 ORDERED-RCsc -->
    <g>
      <rect x="618" y="538" width="172" height="130" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2"/>
      <text x="704" y="560" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">3 · ORDERED-RCsc</text>
      <text x="704" y="578" text-anchor="middle" font-size="10" fill="#334155">LDAR / STLR</text>
      <text x="704" y="594" text-anchor="middle" font-size="10" fill="#334155">v8.0 · acquire/release</text>
      <text x="704" y="614" text-anchor="middle" font-size="9.5" fill="#9a3412">LDAR：排空或阻止后续 load</text>
      <text x="704" y="630" text-anchor="middle" font-size="9.5" fill="#9a3412">STLR：按序全局可见</text>
      <text x="704" y="646" text-anchor="middle" font-size="9.5" fill="#9a3412">MOB 排序过滤器（独立层）</text>
      <text x="704" y="662" text-anchor="middle" font-size="9" font-weight="600" fill="#b45309">★ V110 能力上限（RCsc+LSE）</text>
    </g>
    <!-- Step 4 ORDERED-RCpc -->
    <g>
      <rect x="804" y="484" width="172" height="130" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
      <text x="890" y="506" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">4 · ORDERED-RCpc</text>
      <text x="890" y="524" text-anchor="middle" font-size="10" fill="#334155">LDAPR（LRCPC）</text>
      <text x="890" y="540" text-anchor="middle" font-size="10" fill="#334155">v8.3 · RCsc 放松两点</text>
      <text x="890" y="560" text-anchor="middle" font-size="9.5" fill="#9a3412">更轻年龄追踪（N1 口径）</text>
      <text x="890" y="576" text-anchor="middle" font-size="9.5" fill="#9a3412">两档一致性：RCsc/RCpc</text>
      <text x="890" y="592" text-anchor="middle" font-size="9" fill="#6b7280">同 PE release→acq 不额外排序</text>
      <text x="890" y="606" text-anchor="middle" font-size="9" font-weight="600" fill="#7c3aed">◆ N1 有（ISAR1.RCPC=1）</text>
    </g>
    <!-- Step 5 LIMITEDORDERED -->
    <g>
      <rect x="990" y="430" width="172" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 3"/>
      <text x="1076" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">5 · LIMITED-ORDERED</text>
      <text x="1076" y="470" text-anchor="middle" font-size="10" fill="#334155">LDLAR（LOR）</text>
      <text x="1076" y="486" text-anchor="middle" font-size="10" fill="#334155">v8.1 · 有限有序</text>
      <text x="1076" y="506" text-anchor="middle" font-size="9.5" fill="#6d28d9">序约束不全局展开</text>
      <text x="1076" y="522" text-anchor="middle" font-size="9.5" fill="#6d28d9">比 RCsc 更粗粒度跟踪</text>
      <text x="1076" y="538" text-anchor="middle" font-size="9" fill="#6b7280">两机均未实现 · 语义待考</text>
    </g>
    <!-- Step 6 ATOMICLS64 -->
    <g>
      <rect x="1176" y="376" width="172" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 3"/>
      <text x="1262" y="398" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">6 · ATOMICLS64</text>
      <text x="1262" y="416" text-anchor="middle" font-size="10" fill="#334155">LD64B</text>
      <text x="1262" y="432" text-anchor="middle" font-size="10" fill="#334155">v8.7 · 512-bit 单拷贝原子</text>
      <text x="1262" y="452" text-anchor="middle" font-size="9.5" fill="#6d28d9">需 512-bit 专用访问口</text>
      <text x="1262" y="468" text-anchor="middle" font-size="9.5" fill="#6d28d9">网络缓冲一次搬运描述符</text>
      <text x="1262" y="484" text-anchor="middle" font-size="9" fill="#6b7280">两机均未实现（N2/V2 世代）</text>
    </g>
  </g>

  <!-- rising arrows between steps -->
  <g stroke="#374151" stroke-width="2">
    <line x1="232" y1="760" x2="242" y2="706" marker-end="url(#arw)"/>
    <line x1="418" y1="706" x2="428" y2="652" marker-end="url(#arw)"/>
    <line x1="604" y1="652" x2="614" y2="598" marker-end="url(#arw)"/>
    <line x1="790" y1="598" x2="800" y2="544" marker-end="url(#arw)"/>
    <line x1="976" y1="544" x2="986" y2="490" marker-end="url(#arw)"/>
    <line x1="1162" y1="490" x2="1172" y2="436" marker-end="url(#arw)"/>
  </g>
  <!-- ladder annotation -->
  <text x="620" y="860" font-size="12" fill="#374155" font-weight="600">谱系每升一级 → MOB 多一层跟踪结构：依赖预测 → 监视器状态机 → 排序过滤器 → 年龄矩阵分档</text>
  <text x="620" y="878" font-size="10.5" fill="#6b7280">双向性：也是软件合同阶梯——程序员/编译器每选低一级指令，就多背一分显式同步义务；序从软件屏障搬进 ISA 编码是 RCsc/RCpc 的本质，终点是 LSE（把重试循环也搬进编码）</text>

  <!-- ============ LSE side branch (parallel path) ============ -->
  <g>
    <rect x="246" y="200" width="380" height="130" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="262" y="224" font-size="13" font-weight="700" fill="#92400e">平行支线：LSE 原子（v8.1，不走监视器）</text>
    <text x="262" y="244" font-size="10.5" fill="#334155">LDADD / CAS / SWP —— 单事务 read-modify-write，一条指令完成原子加/交换</text>
    <text x="262" y="262" font-size="10.5" fill="#334155">LDADAL 一条完成"原子加 + 全序"（A=aquire L=release AL=acq_rel 无=relaxed）</text>
    <text x="262" y="282" font-size="10.5" fill="#92400e" font-weight="600">三级执行点（N1 TRM 实证）：</text>
    <text x="262" y="300" font-size="10.5" fill="#92400e">near（L1D Unique 命中）→ far（CHI 接口）→ 互连执行 或 DSU L3 执行</text>
    <text x="262" y="318" font-size="9.5" fill="#6b7280">软件诱导 near：原子前 PLDW / PRFM PSTL1KEEP · V110/N1 均 Atomic=2 完整 LSE</text>
    <!-- arrow from LSE box down to step1/3 area -->
    <path d="M 436 330 C 436 380, 500 520, 610 560" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arw)"/>
    <text x="446" y="440" font-size="10" fill="#b45309">LL/SC 活锁的出路</text>
  </g>

  <!-- ============ Normal/stall relation box ============ -->
  <g>
    <rect x="680" y="200" width="380" height="130" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
    <text x="696" y="224" font-size="13" font-weight="700" fill="#047857">与 0 级并行的 UNPRIV 支线（PAN）</text>
    <text x="696" y="244" font-size="10.5" fill="#334155">LDTR / STTR：特权代码以 EL0 权限访问（权限降级检查）</text>
    <text x="696" y="262" font-size="10.5" fill="#334155">不在序阶梯上——它是访问权限维度，不是序维度</text>
    <text x="696" y="284" font-size="10.5" fill="#065f46">同族不在阶梯上的还有：STGP（MTE 标签通道，两机无 MTE）、</text>
    <text x="696" y="302" font-size="10.5" fill="#065f46">PRFM（预取提示，非访问——§3.6/第 6 章）</text>
    <text x="696" y="320" font-size="9.5" fill="#6b7280">Load-Store 大类共 123 条，阶梯只收编其中有序语义的部分</text>
  </g>

  <!-- ============ MOB bill stack (bottom-left) ============ -->
  <g>
    <rect x="60" y="120" width="560" height="64" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="76" y="142" font-size="11.5" font-weight="700" fill="#111827">MOB 账单总规律（依赖预测 → 监视器 → 排序过滤器 → 年龄矩阵分档）：</text>
    <text x="76" y="158" font-size="10" fill="#334155">0 级"自由"的精确含义：自由的是硬件检查义务而非错误许可——违规仍被抓回滚，只是事后抓（预测+检测）而非事前拦（全队列 CAM）</text>
    <text x="76" y="174" font-size="10" fill="#334155">x86 TSO 对照：load 不越过任何更老 store → 全队列地址 CAM O(N²) → 乱序窗口物理天花板；ARM 弱序 LSQ 可做得更大（§2.4 因果链 1）</text>
  </g>

  <!-- ============ PMU observability box (right) ============ -->
  <g>
    <rect x="800" y="80" width="560" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
    <text x="816" y="104" font-size="12" font-weight="700" fill="#6d28d9">序等级的 PMU 观测口径（验证程序是否真用了正确的序指令）</text>
    <text x="816" y="124" font-size="10.5" fill="#334155">N1（TRM 事件表）：0x90/0x91 RC_LD/RC_ST 计数 LDAR/STLR 族；</text>
    <text x="816" y="140" font-size="10.5" fill="#334155">0x6C–0x6F LDREX/STREX pass/fail（验证锁实现是否退化为 LL/SC 而非 LSE）</text>
    <text x="816" y="160" font-size="10.5" fill="#334155">V110（实测）：imp-def mem_stall 家族 0x7004/0x7006/0x7007</text>
    <text x="816" y="176" font-size="10.5" fill="#334155">（访存停顿周期级分解）+ br_mis_pred 0x10</text>
    <text x="816" y="194" font-size="9.5" fill="#b91c1c" font-weight="600">仿真边界：gem5 经典内存系统不建模 TSO-vs-弱序差异——序谱系定量实证只能靠真机（第 10 章）</text>
  </g>

  <!-- V110 / N1 capability marker band above ladder -->
  <g>
    <rect x="60" y="70" width="700" height="34" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
    <text x="76" y="92" font-size="11.5" font-weight="600" fill="#9a3412">两机落点：V110 与 N1 均完整实现 0–3 级 + LSE（ISAR0.Atomic=2）→ 一代服务器核的序能力停在 "RCsc + LSE"（2019 负载域够用的合同）</text>
    <text x="580" y="92" font-size="11" fill="#7c3aed" font-weight="600">N1 额外：第 4 级 LDAPR ◆</text>
  </g>

  <!-- footer -->
  <text x="30" y="838" font-size="10.5" fill="#9ca3af">图 3-1：ARMv8 内存序七级阶梯（AccType 谱系）· 虚线框 = 两台研究机均未实现的等级 · 与正文 §3.3 表格逐行对应 · gem5 StoreSet=SSIT/LFST 1024 项、checkViolations depCheckShift(4) 见 §3.10</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 536" width="1080" height="536" style="max-width:100%;height:auto;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#fafafa;color:#1f2937;">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
  </defs>

  <!-- 标题与图例（原 HTML 外壳并入 SVG 本体） -->
  <text x="16" y="30" font-size="17" font-weight="700" fill="#1f2937">FSU 与 LSU：IEW 里的两类执行单元（示意）</text>
  <text x="16" y="52" font-size="13" fill="#6b7280">红 = CHAOS 注入点 · FSU 管"算" · LSU 管"搬"</text>

  <g transform="translate(0,56)">
    <!-- 流水线上下文 -->
    <rect x="60" y="40" width="110" height="30" rx="6" fill="#ffffff" stroke="#059669"/><text x="115" y="60" font-size="12.5" text-anchor="middle" fill="#1f2937">Rename</text>
    <text x="178" y="60" font-size="13" fill="#059669">→</text>
    <rect x="196" y="40" width="320" height="30" rx="6" fill="#d1fae5" stroke="#059669"/><text x="356" y="60" font-size="12.5" text-anchor="middle" fill="#047857">IEW（发射 / 执行 / 写回）</text>
    <text x="524" y="60" font-size="13" fill="#059669">→</text>
    <rect x="542" y="40" width="110" height="30" rx="6" fill="#ffffff" stroke="#059669"/><text x="597" y="60" font-size="12.5" text-anchor="middle" fill="#1f2937">Commit</text>
    <text x="680" y="60" font-size="12" fill="#6b7280">FSU / LSU 都属于 IEW 的执行侧</text>

    <!-- 下发到两个单元 -->
    <line x1="280" y1="70" x2="280" y2="140" stroke="#0891b2" stroke-width="2.5" marker-end="url(#a1)"/>
    <line x1="800" y1="70" x2="800" y2="140" stroke="#ea580c" stroke-width="2.5" marker-end="url(#a2)"/>

    <!-- FSU -->
    <rect x="40" y="145" width="480" height="290" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="58" y="175" font-size="15" font-weight="700" fill="#155e75">FSU —— 浮点执行单元</text>
    <text x="58" y="202" font-size="12.5" fill="#1f2937">职责：执行浮点 / 向量指令 —— FMA、加、乘、转换、除法/开方</text>
    <text x="58" y="226" font-size="12.5" fill="#1f2937">数据通路：源/目的 = PhysFloatRegFile（浮点物理寄存器堆）</text>
    <text x="58" y="250" font-size="12.5" fill="#1f2937">内部：FP 执行管线 + 延迟表 + 写回路径（setRegOperand 前）</text>
    <text x="58" y="286" font-size="12.5" font-weight="700" fill="#dc2626">CHAOS 注入点：</text>
    <text x="58" y="308" font-size="12.5" fill="#1f2937">CHAOSFPU —— source-read 毁值（getRegOperand，读源瞬间）</text>
    <text x="58" y="330" font-size="12.5" fill="#1f2937">CHAOSFPU —— writeback 毁值（setRegOperand，进 PRF 之前）</text>
    <text x="58" y="354" font-size="12.5" fill="#1f2937">故障形态：IEEE754 位段（sign / exp / mantissa）</text>
    <text x="58" y="378" font-size="12.5" fill="#1f2937">位谱实验：gemm / fma 内核</text>
    <text x="58" y="414" font-size="12.5" font-weight="700" fill="#155e75">一句话：FSU 的故障 = 算出来的值错了（且可能完全合法）</text>

    <!-- LSU -->
    <rect x="560" y="145" width="480" height="290" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="578" y="175" font-size="15" font-weight="700" fill="#7c2d12">LSU —— 访存单元（Load-Store Unit）</text>
    <text x="578" y="202" font-size="12.5" fill="#1f2937">职责：执行 load / store —— 从内存搬数据，不做算术</text>
    <text x="578" y="226" font-size="12.5" fill="#1f2937">内部链：AGU 地址生成 → MMU/TLB 翻译 → L1D 访问</text>
    <text x="578" y="250" font-size="12.5" fill="#1f2937">未命中 → MSHR 合并 → miss 下行；LQ + SQ 管理在飞访存</text>
    <text x="578" y="274" font-size="12.5" fill="#1f2937">store→load 转发：SQ 中比 load 年长的 store 直接 memcpy 给 load</text>
    <text x="578" y="286" font-size="12.5" font-weight="700" fill="#dc2626">CHAOS 注入点：</text>
    <text x="578" y="308" font-size="12.5" fill="#1f2937">CHAOSLSQFwd —— 转发错源 / 毁数据（双 hook）</text>
    <text x="578" y="330" font-size="12.5" fill="#1f2937">CHAOSAddrPath —— AGU→MMU 地址通路毁 vaddr</text>
    <text x="578" y="354" font-size="12.5" fill="#1f2937">下游还有：CHAOSCache / CHAOSMem / ArmTLB / PTW</text>
    <text x="578" y="378" font-size="12.5" fill="#1f2937">关键：转发通路不经过 cache / PRF —— 独立故障域</text>
    <text x="578" y="414" font-size="12.5" font-weight="700" fill="#7c2d12">一句话：LSU 的故障 = 拿错的数据 / 错地址</text>
  </g>
</svg>

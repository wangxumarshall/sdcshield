# zizmor 噪声治理(基线 2026-09-25:78 findings,详见
# docs/superpowers/plans/2026-09-25-ci-capability-campaign.md):
# - unpinned-uses:官方/社区 action 用 major tag,版本治理交给 Dependabot
#   (依赖升级 PR 统一审),不 pin SHA——单人公开仓的维护成本权衡。
# - template-injection:本仓 workflow 无 pull_request_target,pull_request
#   事件下注入面限于 PR 作者自己的 runner。⚠️ 将来引入 pull_request_target
#   时必须重新启用本检查。
# - self-repository / github-env:风格类,关闭。
# 真修项:artipacked(persist-credentials)、excessive-permissions(job 级收紧),
# 由后续 commit 落地,本配置先收噪声。
rules:
  unpinned-uses:
    disable: true
  template-injection:
    disable: true
  self-repository:
    disable: true
  github-env:
    disable: true
